services:
  coolapk-web:
    image: ${COOLAPK_WEB_IMAGE:-ghcr.io/coolapk-desktop/coolapk-desktop:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COOLAPK_WEB_PORT:-17521}:8080"
    environment:
      COOLAPK_WEB_ORIGIN: ${COOLAPK_WEB_ORIGIN:-http://127.0.0.1:${COOLAPK_WEB_PORT:-17521}}
      COOLAPK_WEB_ALLOW_LOCAL_CONTAINER: "1"
    volumes:
      - coolapk-web-data:/var/lib/coolapk-web

volumes:
  coolapk-web-data:
