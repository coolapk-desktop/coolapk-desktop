name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]*', '!v*-beta.*']
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      build_version:
        type: string
        required: false
      build_sha:
        type: string
        required: false
      test_platform:
        description: '仅构建指定平台的测试包'
        type: string
        required: false
      create_release:
        type: boolean
        required: false
        default: false
      release_tag:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      create_release:
        description: '发布 GitHub Release（需填写已推送的正式版本标签）'
        type: boolean
        default: false
      release_tag:
        description: '正式版本标签，例如 v1.36.0'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.build_version || github.ref }}
  cancel-in-progress: ${{ !inputs.build_version }}

env:
  BUILD_VERSION: ${{ inputs.build_version }}
  RELEASE_TAG: ${{ inputs.build_version && format('v{0}', inputs.build_version) || inputs.release_tag || github.ref_name }}
  VITE_BUILD_COMMIT: ${{ inputs.build_sha || github.sha }}

jobs:
  docker-image:
    name: 构建酷安 Web 镜像
    if: ${{ !inputs.test_platform }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      PUBLISH_IMAGE: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.build_version != '' || (inputs.create_release && inputs.release_tag != '') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_sha || (inputs.create_release && inputs.release_tag != '' && inputs.release_tag) || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - id: metadata
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$RELEASE_TAG"
          if [[ "$GITHUB_REF" == refs/tags/* || -n "$BUILD_VERSION" || "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || exit 1
          else
            version="sha-${GITHUB_SHA}"
          fi
          {
            echo 'tags<<END_TAGS'
            echo "$image:$version"
            if [[ "$PUBLISH_IMAGE" == "true" && "$GITHUB_REF" == refs/tags/* && "$version" != *-beta.* ]]; then
              echo "$image:latest"
            fi
            echo END_TAGS
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: env.PUBLISH_IMAGE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          provenance: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ─── 前端测试矩阵（多代理并行） ───
  frontend-tests:
    name: ${{ matrix.name }}
    if: ${{ !inputs.test_platform }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 前端单元测试
            task: unit
          - name: 前端类型检查
            task: typecheck
          - name: 前端构建检查
            task: build
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_sha || (inputs.create_release && inputs.release_tag != '' && inputs.release_tag) || github.sha }}

      - name: 记录实际构建源码提交
        shell: bash
        run: echo "VITE_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 同步测试构建版本
        if: ${{ inputs.build_version != '' }}
        shell: bash
        run: npm run version:set -- "$BUILD_VERSION" --beta

      - name: 运行单元测试
        if: matrix.task == 'unit'
        run: npm test

      - name: 测试版本与全平台产物检查
        if: matrix.task == 'unit'
        run: node --test scripts/test-beta-release.mjs

      - name: 运行类型检查
        if: matrix.task == 'typecheck'
        run: npm run typecheck

      - name: 前端构建
        if: matrix.task == 'build'
        run: npm run build

  # ─── Rust 测试 ───
  rust-tests:
    name: Rust 测试 (${{ matrix.name }})
    if: ${{ !inputs.test_platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_sha || (inputs.create_release && inputs.release_tag != '' && inputs.release_tag) || github.sha }}

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 同步测试构建版本
        if: ${{ inputs.build_version != '' }}
        shell: bash
        run: npm run version:set -- "$BUILD_VERSION" --beta

      - name: 构建前端
        run: npm run build

      - name: Rust 类型与编译检查
        working-directory: src-tauri
        run: cargo check

      - name: Rust 测试
        working-directory: src-tauri
        # 库测试需要额外清单；仅在此步骤启用，应用打包继续使用 Tauri 自带清单。
        env:
          COOLAPK_RUST_TEST_MANIFEST: '1'
        run: cargo test --lib

      - name: 更新助手替换与回滚测试
        if: runner.os != 'Windows'
        run: sh scripts/test-desktop-update.sh

  # ─── 构建（仅 tag / 手动触发） ───
  desktop-matrix:
    name: 选择桌面打包目标
    if: ${{ (inputs.test_platform && inputs.test_platform != 'ios-arm64' && inputs.test_platform != 'android-arm64') || (!inputs.test_platform && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || inputs.build_version != '')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - name: 筛选桌面平台
        id: select
        shell: bash
        env:
          TEST_PLATFORM: ${{ inputs.test_platform }}
          DESKTOP_TARGETS: |
            [
            {"target": "windows-x64", "name": "Windows x64", "platform": "windows-latest", "args": "--bundles nsis", "rustTargets": "", "portableArch": "x64", "portableTarget": ""},
            {"target": "windows-arm64", "name": "Windows ARM64", "platform": "windows-latest", "args": "--target aarch64-pc-windows-msvc --bundles nsis", "rustTargets": "aarch64-pc-windows-msvc", "portableArch": "arm64", "portableTarget": "aarch64-pc-windows-msvc"},
            {"target": "linux-x64", "name": "Linux x64", "platform": "ubuntu-22.04", "args": "--bundles deb,rpm", "rustTargets": ""},
            {"target": "macos-arm64", "name": "macOS Apple Silicon", "platform": "macos-latest", "args": "--target aarch64-apple-darwin --bundles app,dmg", "rustTargets": "aarch64-apple-darwin"},
            {"target": "macos-x64", "name": "macOS Intel", "platform": "macos-latest", "args": "--target x86_64-apple-darwin --bundles app,dmg", "rustTargets": "x86_64-apple-darwin"}
            ]
        run: |
          # 普通发布保留全部桌面目标，手动测试只保留选中的目标。
          selected="$(jq -ce --arg target "$TEST_PLATFORM" '[.[] | select($target == "" or .target == $target)] | select(length > 0)' <<< "$DESKTOP_TARGETS")"
          echo "include=$selected" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: desktop-matrix
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.desktop-matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_sha || (inputs.create_release && inputs.release_tag != '' && inputs.release_tag) || github.sha }}

      - name: 记录实际构建源码提交
        shell: bash
        env:
          TEST_PLATFORM: ${{ inputs.test_platform }}
        run: |
          echo "VITE_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [[ -n "$TEST_PLATFORM" ]]; then
            echo "TEST_ARTIFACT_SUFFIX=-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          fi

      - name: 验证手动 Release 标签
        if: ${{ !inputs.test_platform && github.event_name == 'workflow_dispatch' && inputs.create_release }}
        shell: bash
        env:
          TARGET_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$TARGET_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release 标签必须是已推送的正式版本，例如 v1.36.0。" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TARGET_RELEASE_TAG" || {
            echo "找不到标签 $TARGET_RELEASE_TAG；请先推送该标签，再运行 Release。" >&2
            exit 1
          }

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # runner 架构相同不代表编译目标相同，防止 x64/ARM64 争用同一个缓存。
          key: release-${{ matrix.rustTargets || 'native' }}
          cache-on-failure: true

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm squashfs-tools

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 同步测试构建版本
        if: ${{ inputs.build_version != '' }}
        shell: bash
        run: npm run version:set -- "$BUILD_VERSION" --beta

      - name: 同步标签版本号
        if: ${{ !inputs.test_platform && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != '')) }}
        shell: bash
        run: npm run version:set -- "${RELEASE_TAG#v}"

      - name: 构建前端
        run: npm run build

      - name: 设置 CI 包名并复用已构建的前端
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.productName = "coolapk-desktop";
            if (!fs.existsSync("dist/index.html")) throw new Error("缺少本次前端构建产物");
            conf.build.beforeBuildCommand = "";
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2));
          '

      - name: 构建与上传产物（非 Tag 推送）
        if: ${{ !(runner.os == 'Linux' && inputs.build_version != '') && (inputs.test_platform || (!startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != ''))) }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]${{ env.TEST_ARTIFACT_SUFFIX }}'

      - name: 发布 Release 产物
        if: ${{ !inputs.test_platform && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != '')) }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 酷安 ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}

      - name: 构建 Linux 测试版系统安装包
        if: ${{ runner.os == 'Linux' && inputs.build_version != '' }}
        shell: bash
        run: |
          node -e 'const fs=require("fs"); const [base,n]=process.env.BUILD_VERSION.split("-beta."); fs.writeFileSync("beta-linux.json",JSON.stringify({version:base,bundle:{linux:{rpm:{release:`0.beta.${n}`}}}}));'
          npm run tauri -- build --no-bundle
          npm run tauri -- bundle --bundles deb,rpm --config beta-linux.json
          base="${BUILD_VERSION%-beta.*}"
          number="${BUILD_VERSION##*-beta.}"
          deb="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb -R "$deb" deb-beta
          sed -i "s/^Version:.*/Version: ${base}~beta.${number}/" deb-beta/DEBIAN/control
          mkdir -p linux-beta
          dpkg-deb --build --root-owner-group deb-beta "linux-beta/coolapk-desktop_${BUILD_VERSION}_amd64.deb"
          rpm="$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$rpm"
          cp "$rpm" "linux-beta/coolapk-desktop-${BUILD_VERSION}-1.x86_64.rpm"
          test "$(dpkg-deb -f linux-beta/*.deb Version)" = "${base}~beta.${number}"
          test "$(rpm -qp --queryformat '%{VERSION}-%{RELEASE}' linux-beta/*.rpm)" = "${base}-0.beta.${number}"

      - name: 上传 Linux 测试版系统安装包
        if: ${{ runner.os == 'Linux' && inputs.build_version != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-beta-packages
          path: linux-beta/*
          if-no-files-found: error

      - name: 构建并修复 Linux AppImage 权限
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          npm run tauri -- bundle --bundles appimage
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          bash scripts/fix-appimage-permissions.sh "$appimage"

      - name: 上传 Linux AppImage 工作流产物
        if: ${{ runner.os == 'Linux' && (inputs.test_platform || (!startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != ''))) }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-appimage${{ env.TEST_ARTIFACT_SUFFIX }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: 发布 Linux AppImage
        if: ${{ runner.os == 'Linux' && (!inputs.test_platform && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != ''))) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/appimage/*.AppImage --repo "$GITHUB_REPOSITORY"

      - name: 准备 Windows 单文件便携版
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: >-
          ./scripts/prepare-windows-portable.ps1
          -Architecture '${{ matrix.portableArch }}'
          -RustTarget '${{ matrix.portableTarget }}'

      - name: 上传 Windows 单文件便携版
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.portableArch }}-portable${{ env.TEST_ARTIFACT_SUFFIX }}
          path: src-tauri/target/portable/*.exe
          if-no-files-found: error

      - name: 校验 macOS App 包签名
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          app_path="$(find src-tauri/target -type d -path '*/release/bundle/macos/*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "未找到 macOS .app 产物" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign --display --verbose=4 "$app_path"

  ios-build:
    name: iOS ARM64 未签名 IPA
    if: ${{ inputs.test_platform == 'ios-arm64' || (!inputs.test_platform && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || inputs.build_version != '')) }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_sha || (inputs.create_release && inputs.release_tag != '' && inputs.release_tag) || github.sha }}

      - name: 记录实际构建源码提交
        shell: bash
        env:
          TEST_PLATFORM: ${{ inputs.test_platform }}
        run: |
          echo "VITE_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [[ -n "$TEST_PLATFORM" ]]; then
            echo "TEST_ARTIFACT_SUFFIX=-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          fi

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust iOS 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 同步测试构建版本
        if: ${{ inputs.build_version != '' }}
        shell: bash
        run: npm run version:set -- "$BUILD_VERSION" --beta

      - name: 同步标签版本号
        if: ${{ !inputs.test_platform && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != '')) }}
        shell: bash
        run: npm run version:set -- "${RELEASE_TAG#v}"

      - name: 设置 CI 纯英文包名 (coolapk-desktop)
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            conf.productName = "coolapk-desktop";
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(conf, null, 2));
          '

      - name: 初始化 iOS 工程
        run: npm run tauri -- ios init --ci --skip-targets-install

      - name: 注入 iOS 相册权限说明与中文本地化
        shell: bash
        run: |
          plist="$(find src-tauri/gen/apple -type f -path '*_iOS/Info.plist' -print -quit)"
          if [[ -z "$plist" ]]; then
            plist="$(find src-tauri/gen/apple -type f -name Info.plist -not -path '*/Frameworks/*' -print -quit)"
          fi
          if [[ -z "$plist" ]]; then
            echo "未找到 iOS 工程 Info.plist" >&2
            exit 1
          fi
          echo "目标 Info.plist: $plist"

          pb=/usr/libexec/PlistBuddy
          usage='保存图片到相册需要访问照片权限'

          # 先删后加，避免依赖 Set 对不存在键的返回码。
          set_string() {
            $pb -c "Delete :$1" "$plist" 2>/dev/null || true
            $pb -c "Add :$1 string $2" "$plist"
          }

          # 系统长按菜单（存储到照片）与权限弹窗的语言跟随 App 声明的本地化，
          # 不写这两项时系统一律按英文兜底。
          set_string CFBundleDevelopmentRegion zh_CN
          $pb -c "Delete :CFBundleLocalizations" "$plist" 2>/dev/null || true
          $pb -c "Add :CFBundleLocalizations array" "$plist"
          $pb -c "Add :CFBundleLocalizations:0 string zh-Hans" "$plist"
          $pb -c "Add :CFBundleLocalizations:1 string zh-Hant" "$plist"

          # WKWebView 长按图片的「存储到照片」会直接写相册：缺少下面两条说明时
          # iOS 会按隐私越权直接终止 App，表现就是点一下即闪退。
          set_string NSPhotoLibraryAddUsageDescription "$usage"
          set_string NSPhotoLibraryUsageDescription "$usage"

          plutil -lint "$plist"
          $pb -c "Print :CFBundleDevelopmentRegion" "$plist"
          $pb -c "Print :CFBundleLocalizations" "$plist"
          $pb -c "Print :NSPhotoLibraryAddUsageDescription" "$plist"

      - name: 构建未签名 IPA
        run: npm run tauri -- ios build --target aarch64 --no-sign --ci

      - name: 整理并校验 iOS Release 产物
        shell: bash
        run: |
          ipa="$(find src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa" ]]; then
            echo "未找到 iOS IPA 产物" >&2
            exit 1
          fi

          unzip -t "$ipa"

          # 打进 IPA 的 Info.plist 必须真的带上权限说明，否则真机点「存储到照片」仍会闪退。
          work="$(mktemp -d)"
          unzip -q "$ipa" -d "$work"
          app_plist="$(find "$work/Payload" -maxdepth 2 -name Info.plist -print -quit)"
          if [[ -z "$app_plist" ]]; then
            echo "IPA 内未找到 Payload/*.app/Info.plist" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$app_plist" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$app_plist" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :CFBundleLocalizations:0" "$app_plist" >/dev/null
          expected_base="$(node -p 'require("./package.json").version.split("-beta.")[0]')"
          expected_build="$(node -p 'require("./src-tauri/tauri.conf.json").bundle.iOS.bundleVersion')"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_plist")" = "$expected_base"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_plist")" = "$expected_build"
          echo "IPA 内 Info.plist 权限与本地化校验通过"
          rm -rf "$work"

          mkdir -p ios-release
          ref_name="${TEST_ARTIFACT_SUFFIX#-}"
          ref_name="${ref_name:-${RELEASE_TAG//\//-}}"
          cp "$ipa" "ios-release/coolapk-${ref_name}-ios-arm64-unsigned.ipa"

      - name: 上传 iOS 未签名 IPA
        uses: actions/upload-artifact@v6
        with:
          name: ios-arm64-unsigned${{ env.TEST_ARTIFACT_SUFFIX }}
          path: ios-release/*.ipa
          if-no-files-found: error

  # Android 签名 Secrets 探测。
  #
  # fork 上没有配置 ANDROID_KEYSTORE_* 四个 Secrets 时，签名准备步骤必然失败，
  # 整个 run 会变红并持续发失败邮件。Secrets 不能在 job 级 if 里直接读取，
  # 所以先用一个小 job 把「是否具备签名条件」导出成 output，再由 android-build 消费。
  # 上游 Secrets 齐全时输出 true，行为与原来完全一致；补齐 Secrets 后无需再改代码。
  android-signing-check:
    name: 检查 Android 签名 Secrets
    if: ${{ inputs.test_platform == 'android-arm64' || (!inputs.test_platform && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || inputs.build_version != '')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      has_signing: ${{ steps.check.outputs.has_signing }}
    steps:
      - name: 探测签名 Secrets
        id: check
        shell: bash
        env:
          TEST_PLATFORM: ${{ inputs.test_platform }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
            echo "Android 签名 Secrets 已配置，将执行 Android Release 构建。"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "缺少 Android Release 签名 Secrets，本次跳过 Android Release 构建。" >&2
            if [[ -n "$BUILD_VERSION" || -n "$TEST_PLATFORM" ]]; then exit 1; fi
          fi

  android-build:
    name: Android ARM64 Release
    needs: [android-signing-check]
    if: ${{ needs.android-signing-check.outputs.has_signing == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_sha || (inputs.create_release && inputs.release_tag != '' && inputs.release_tag) || github.sha }}

      - name: 记录实际构建源码提交
        shell: bash
        env:
          TEST_PLATFORM: ${{ inputs.test_platform }}
        run: |
          echo "VITE_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [[ -n "$TEST_PLATFORM" ]]; then
            echo "TEST_ARTIFACT_SUFFIX=-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          fi

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装 Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 缓存 Gradle 依赖与构建工具
        uses: gradle/actions/setup-gradle@v5
        with:
          # 测试版和正式 tag 构建也需要写入缓存；签名文件不在 Gradle User Home 中。
          cache-read-only: false

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android 平台与 NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: 安装 Rust Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 同步测试构建版本
        if: ${{ inputs.build_version != '' }}
        shell: bash
        run: npm run version:set -- "$BUILD_VERSION" --beta

      - name: 同步标签版本号
        if: ${{ !inputs.test_platform && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != '')) }}
        shell: bash
        run: npm run version:set -- "${RELEASE_TAG#v}"

      - name: 准备 Android Release 签名
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "缺少 Android Release 签名 Secrets" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coolapk-upload.jks"

      - name: 构建签名 APK 和 AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/coolapk-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:build -- --target aarch64 --apk --aab --ci

      - name: 整理 Android Release 产物
        shell: bash
        run: |
          mkdir -p android-release
          apk="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          aab="src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab"
          test -f "$apk"
          test -f "$aab"
          # minSdk >= 24 时 apksigner 默认不验证 v1，按 API 23 验证才能检查 v1/v2 是否都存在。
          verification="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 23 "$apk")"
          printf '%s\n' "$verification"
          grep -Fqx 'Verified using v1 scheme (JAR signing): true' <<< "$verification"
          grep -Fqx 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$verification"
          expected_version="$(node -p 'require("./package.json").version')"
          expected_code="$(node -p 'require("./src-tauri/tauri.conf.json").bundle.android.versionCode')"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          grep '^package:' <<< "$badging" | grep -F "versionName='$expected_version'" | grep -F "versionCode='$expected_code'"
          ref_name="${TEST_ARTIFACT_SUFFIX#-}"
          ref_name="${ref_name:-$RELEASE_TAG}"
          cp "$apk" "android-release/coolapk-${ref_name}-android-arm64.apk"
          cp "$aab" "android-release/coolapk-${ref_name}-android-arm64.aab"

      - name: 上传 Android Release 产物
        uses: actions/upload-artifact@v6
        with:
          name: android-arm64-release${{ env.TEST_ARTIFACT_SUFFIX }}
          path: android-release/*
          if-no-files-found: error

  publish-android:
    name: 发布 Android APK 和 AAB
    needs: [build, android-build]
    if: ${{ !inputs.test_platform && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != '')) }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载 Android 产物
        uses: actions/download-artifact@v7
        with:
          name: android-arm64-release
          path: android-release

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" android-release/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-ios:
    name: 发布 iOS 未签名 IPA
    needs: [build, ios-build]
    if: ${{ !inputs.test_platform && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != '')) }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载 iOS 产物
        uses: actions/download-artifact@v7
        with:
          name: ios-arm64-unsigned
          path: ios-release

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" ios-release/*.ipa --repo "$GITHUB_REPOSITORY" --clobber

  publish-windows-portable:
    name: 发布 Windows 单文件便携版
    needs: build
    if: ${{ !inputs.test_platform && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.release_tag != '')) }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载 Windows 单文件产物
        uses: actions/download-artifact@v7
        with:
          pattern: windows-*-portable
          path: portable
          merge-multiple: true

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" portable/*.exe --repo "$GITHUB_REPOSITORY"
